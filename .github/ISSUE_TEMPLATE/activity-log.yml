name: 山行ログ登録
description: 山行の記録をサイトに登録します（GPXファイルはIssue作成後、案内されるPRに追加でアップロードしてください）
title: "[山行ログ] "
labels: ["activity-log"]
body:
  - type: input
    id: mountain
    attributes:
      label: 山名
      description: 例：乳（にゅう）
      placeholder: 乳（にゅう）
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 日付
      description: "YYYY-MM-DD形式で入力してください"
      placeholder: "2026-05-02"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: エリア
      description: 例：八ヶ岳
      placeholder: 八ヶ岳
    validations:
      required: true
  - type: textarea
    id: members
    attributes:
      label: メンバー
      description: 参加メンバーを1行に1人ずつ入力してください
      placeholder: |
        Avo
        Koyama
        Shigebayashi
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: メモ（任意）
      description: 山行の感想やメモがあれば
    validations:
      required: false
