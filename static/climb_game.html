<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>糞取山登山ゲーム - Pistachio Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border: 2px solid #333;
            background-color: #000;
        }

        canvas {
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 5;
        }

        #altitude {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.1em;
        }

        #mountain-name {
            font-size: 14px;
            color: #8f8;
            margin-top: 5px;
        }

        #next-mountain {
            font-size: 13px;
            color: #9cf;
            margin-top: 4px;
        }

        .ingame-audio {
            position: fixed; /* プレイ領域の外に独立配置 */
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 10px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 11px;
            color: #ddd;
            pointer-events: auto;
            z-index: 50;
            display: none; /* 初期画面では非表示 */
        }

        .ingame-audio label {
            display: block;
            margin-bottom: 4px;
        }

        .ingame-audio input[type="range"] {
            width: 140px;
        }

        .ingame-audio button {
            width: 100%;
            padding: 6px 0;
            margin-top: 6px;
            font-size: 11px;
        }

        #mountain-alert {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 100, 0, 0.95);
            color: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            z-index: 15;
            display: none;
            animation: alertPop 0.3s ease-out;
            border: 2px solid #8f8;
        }

        @keyframes alertPop {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 4px;
            width: 300px;
            z-index: 10;
            border: 1px solid #444;
            max-height: 80vh;
            overflow-y: auto;
        }

        h1 {
            margin-top: 0;
            letter-spacing: 0.3em;
            font-size: 24px;
        }

        button {
            background: #fff;
            border: none;
            padding: 12px 40px;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }

        button:hover {
            background: #ccc;
            transform: scale(1.05);
        }

        button.secondary {
            background: #444;
            color: #fff;
            padding: 8px 20px;
            font-size: 14px;
        }

        button.secondary:hover {
            background: #666;
        }

        .controls-guide {
            font-size: 11px;
            margin-top: 25px;
            color: #666;
            line-height: 1.6;
        }

        #score-register {
            display: none;
            margin-top: 20px;
        }

        #score-register input {
            padding: 10px;
            font-size: 16px;
            width: 150px;
            border: none;
            border-radius: 4px;
            text-align: center;
        }

        #ranking-list {
            display: none;
            margin-top: 20px;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
        }

        #ranking-list h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #ffd700;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            border-bottom: 1px solid #333;
            font-size: 12px;
        }

        .ranking-item.top3 {
            color: #ffd700;
            font-weight: bold;
        }

        .ranking-item .rank {
            width: 30px;
        }

        .ranking-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ranking-item .score {
            width: 60px;
            text-align: right;
        }

        .ranking-item .mountain {
            width: 80px;
            text-align: right;
            font-size: 10px;
            color: #8f8;
        }

        .audio-controls {
            margin-top: 16px;
            color: #ccc;
            font-size: 12px;
            text-align: left;
            border-top: 1px solid #333;
            padding-top: 12px;
        }

        .audio-controls label {
            display: block;
            margin-bottom: 6px;
        }

        .audio-controls input[type="range"] {
            width: 100%;
        }

        #bgm-toggle {
            margin-top: 8px;
            width: 100%;
            padding: 8px 0;
        }

        /* バーチャルコントローラー（スマホ用） */
        #virtual-controller {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            pointer-events: none;
            z-index: 20;
        }

        #virtual-controller.active {
            display: block;
        }

        .joystick-area {
            position: absolute;
            left: 20px;
            bottom: 20px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
        }

        .joystick-base {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            position: relative;
        }

        .joystick-stick {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.05s;
        }

        .jump-button {
            position: absolute;
            right: 20px;
            bottom: 20px;
            width: 80px;
            height: 80px;
            background: rgba(255, 100, 100, 0.5);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.6);
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .jump-button:active {
            background: rgba(255, 150, 150, 0.7);
        }
    </style>
</head>

                { name: '木曽駒ヶ岳', altitude: 2956 },
                { name: '甲斐駒ヶ岳', altitude: 2967 },

                { name: '仙丈ヶ岳', altitude: 3033 },
                { name: '塩見岳', altitude: 3052 },
                { name: '御嶽山', altitude: 3067 },
                { name: '赤石岳', altitude: 3121 },
                { name: '荒川岳（悪沢岳）', altitude: 3141 },
                { name: '槍ヶ岳', altitude: 3180 },
                { name: '奥穂高岳', altitude: 3190 },
                { name: '間ノ岳', altitude: 3190 },
                { name: '北岳', altitude: 3193 },
                { name: '富士山', altitude: 3776 },
            ].sort((a, b) => a.altitude - b.altitude);


            const W = 400;
            const H = 600;
            canvas.width = W;
            canvas.height = H;

            let gameState = 'START';
            let player = {
                x: W / 2,
                y: H - 100,
                w: 40,
                h: 40,
                vx: 0,
                vy: 0,
                jump: -13,
                speed: 3.0
            };

            let platforms = [];
            let cameraY = 0;
            let maxAltitude = 0;
            let gravity = 0.45;
            let keys = {};
            let audioContext;
            let bgmPlaying = false;
            let passedMountains = new Set();
            let currentMountain = null;
            let bgmEnabled = true;
            let bgmVolume = 0.05; // default volume

            // バーチャルコントローラー用
            let joystickActive = false;
            let joystickTouchId = null;
            let virtualMoveDirection = 0; // -1: 左, 0: 停止, 1: 右

            // 標高に対応する山を取得
            function getMountainForAltitude(altitude) {
                if (altitude < 877) {
                    return { name: 'ザコ', altitude: 0 };
                }
                let mountain = null;
                for (const m of HYAKUMEIZAN) {
                    if (altitude >= m.altitude) {
                        mountain = m;
                    } else {
                        break;
                    }
                }
                return mountain;
            }

            // 次に目指す百名山を取得
            function getNextMountain(altitude) {
                for (const m of HYAKUMEIZAN) {
                    if (altitude < m.altitude) return m;
                }
                return null;
            }

            function updateNextMountainDisplay(altitude) {
                const next = getNextMountain(altitude);
                if (next) {
                    nextMountainEl.innerText = `次の百名山: ${next.name} (${next.altitude}m)`;
                } else {
                    nextMountainEl.innerText = '百名山コンプリート！';
                }
            }

            // 山を超えた通知表示
            function showMountainAlert(mountain) {
                mountainAlertEl.innerHTML = `${mountain.name}<br>(${mountain.altitude}m) 突破!`;
                mountainAlertEl.style.display = 'block';
                setTimeout(() => {
                    mountainAlertEl.style.display = 'none';
                }, 2000);
            }

            // スコア取得
            async function fetchScores() {
                try {
                    const res = await fetch(SHEETS_API_URL);
                    const data = await res.json();
                    return data || [];
                } catch (e) {
                    console.error('スコア取得エラー:', e);
                    return [];
                }
            }

            // スコア保存
            async function saveScore(name, score) {
                try {
                    const mountain = getMountainForAltitude(score);
                    await fetch(SHEETS_API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            name,
                            score,
                            mountain: mountain ? mountain.name : '-'
                        })
                    });
                    return true;
                } catch (e) {
                    console.error('スコア保存エラー:', e);
                    return false;
                }
            }

            // ランキング表示
            async function showRanking() {
                rankingContentEl.innerHTML = '読み込み中...ちょっと時間かかるよ🍵';
                rankingListEl.style.display = 'block';

                const scores = await fetchScores();
                if (!Array.isArray(scores) || scores.length === 0) {
                    rankingContentEl.innerHTML = '<p style="text-align:center;">まだ記録がありません</p>';
                    return;
                }

                // 外部（Apps Script）から来る値は信用しない。innerHTML は使わず textContent で組み立てる
                const fragment = document.createDocumentFragment();
                scores.slice(0, 100).forEach((s, i) => {
                    const item = document.createElement('div');
                    item.className = i < 3 ? 'ranking-item top3' : 'ranking-item';

                    const score = Math.floor(Number(s && s.score));
                    const cells = [
                        ['rank', `${i + 1}.`],
                        ['name', String((s && s.name) ?? '').slice(0, 20)],
                        ['score', Number.isFinite(score) ? `${score}m` : '-'],
                        ['mountain', String((s && s.mountain) || '-').slice(0, 20)]
                    ];
                    cells.forEach(([cls, text]) => {
                        const span = document.createElement('span');
                        span.className = cls;
                        span.textContent = text;
                        item.appendChild(span);
                    });
                    fragment.appendChild(item);
                });
                rankingContentEl.replaceChildren(fragment);
            }

            function initGame() {
                player.x = W / 2 - 20;
                player.y = H - 100;
                player.vx = 0;
                player.vy = 0;
                cameraY = 0;
                maxAltitude = 0;
                passedMountains = new Set();
                currentMountain = null;
                altitudeEl.innerText = `ALTITUDE: 0m`;
                mountainNameEl.innerText = '';
                updateNextMountainDisplay(0);

                platforms = [];
                platforms.push({ x: 0, y: H - 50, w: W, h: 100, color: '#1a1a1a' });

                for (let i = 1; i < 20; i++) {
                    addPlatform(H - i * 100);
                }
            }

            function addPlatform(y) {
                const w = 70 + Math.random() * 50;
                const x = Math.random() * (W - w);
                platforms.push({ x, y, w, h: 12, color: '#333' });
            }

            function initAudio() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            function playBGM() {
                if (!bgmEnabled || bgmPlaying || !audioContext) return;
                bgmPlaying = true;

                const notes = [ 262, 294, 330, 349, 392, 440, 494, 523 ];
                const pattern = [ 0, 2, 4, 2, 5, 4, 2, 0 ];
                let noteIndex = 0;

                function playNote() {
                    if (gameState !== 'PLAYING' || !bgmEnabled) {
                        bgmPlaying = false;
                        return;
                    }

                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();

                    osc.connect(gain);
                    gain.connect(audioContext.destination);

                    osc.frequency.value = notes[ pattern[ noteIndex % pattern.length ] ];
                    osc.type = 'square';

                    gain.gain.setValueAtTime(bgmVolume, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(Math.max(0.001, bgmVolume * 0.2), audioContext.currentTime + 0.3);

                    osc.start(audioContext.currentTime);
                    osc.stop(audioContext.currentTime + 0.3);

                    noteIndex++;
                    setTimeout(playNote, 300);
                }

                playNote();
            }

            function playJumpSound() {
                if (!audioContext) return;

                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();

                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.frequency.value = 400;
                osc.type = 'sine';

                gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

                osc.start(audioContext.currentTime);
                osc.stop(audioContext.currentTime + 0.1);
            }

            function playMountainSound() {
                if (!audioContext) return;

                const notes = [ 523, 659, 784 ];
                notes.forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = freq;
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.15, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                        osc.start(audioContext.currentTime);
                        osc.stop(audioContext.currentTime + 0.3);
                    }, i * 100);
                });
            }

            // BGM UI
            function setBgmVolume(val) {
                const clamped = Math.max(0, Math.min(100, Number(val) || 0));
                bgmVolume = (clamped / 100) * 0.1; // map 0-100 to 0 - 0.1
                if (bgmVolumeSlider) bgmVolumeSlider.value = clamped;
                if (bgmVolumePlaySlider) bgmVolumePlaySlider.value = clamped;
            }

            function updateBgmToggleLabel() {
                const label = bgmEnabled ? 'BGM: ON' : 'BGM: OFF';
                if (bgmToggleBtn) bgmToggleBtn.innerText = label;
                if (bgmTogglePlayBtn) bgmTogglePlayBtn.innerText = label;
            }

            // 初期表示をUIに反映
            setBgmVolume(bgmVolumeSlider ? bgmVolumeSlider.value : 50);
            updateBgmToggleLabel();

            const handleAction = () => {
                if (gameState === 'PLAYING' && player.vy === 0) {
                    player.vy = player.jump;
                    playJumpSound();
                }
            };

            window.addEventListener('keydown', e => {
                keys[ e.code ] = true;
                if (e.code === 'Space') {
                    handleAction();
                    if (gameState === 'PLAYING') e.preventDefault();
                }
            });

            window.addEventListener('keyup', e => keys[ e.code ] = false);
            canvas.addEventListener('mousedown', handleAction);

            // PC用: canvas直接タッチでジャンプ（スマホではバーチャルコントローラーを使用）
            window.addEventListener('touchstart', (e) => {
                if (gameState === 'PLAYING' && !isMobile()) {
                    handleAction();
                    if (e.target === canvas) e.preventDefault();
                }
            }, { passive: false });

            // バーチャルジョイスティック処理
            function setupVirtualController() {
                if (!isMobile()) return;

                const joystickBase = joystickArea.querySelector('.joystick-base');
                const baseRect = () => joystickBase.getBoundingClientRect();

                // ジョイスティックのタッチ開始
                joystickArea.addEventListener('touchstart', (e) => {
                    if (gameState !== 'PLAYING') return;
                    e.preventDefault();
                    const touch = e.changedTouches[ 0 ];
                    joystickTouchId = touch.identifier;
                    joystickActive = true;
                    updateJoystick(touch.clientX, touch.clientY, baseRect());
                }, { passive: false });

                // ジョイスティックの移動
                joystickArea.addEventListener('touchmove', (e) => {
                    if (!joystickActive || gameState !== 'PLAYING') return;
                    e.preventDefault();
                    for (let touch of e.changedTouches) {
                        if (touch.identifier === joystickTouchId) {
                            updateJoystick(touch.clientX, touch.clientY, baseRect());
                            break;
                        }
                    }
                }, { passive: false });

                // ジョイスティックのタッチ終了
                const endJoystick = (e) => {
                    for (let touch of e.changedTouches) {
                        if (touch.identifier === joystickTouchId) {
                            joystickActive = false;
                            joystickTouchId = null;
                            virtualMoveDirection = 0;
                            joystickStick.style.transform = 'translate(-50%, -50%)';
                            break;
                        }
                    }
                };
                joystickArea.addEventListener('touchend', endJoystick, { passive: false });
                joystickArea.addEventListener('touchcancel', endJoystick, { passive: false });

                // ジョイスティック位置更新
                function updateJoystick(touchX, touchY, rect) {
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const maxDistance = rect.width / 2 - 25;

                    let deltaX = touchX - centerX;
                    let deltaY = touchY - centerY;
                    const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

                    if (distance > maxDistance) {
                        deltaX = (deltaX / distance) * maxDistance;
                        deltaY = (deltaY / distance) * maxDistance;
                    }

                    joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

                    // 左右の移動判定（X軸のみ使用）
                    const threshold = maxDistance * 0.3;
                    if (deltaX < -threshold) {
                        virtualMoveDirection = -1;
                    } else if (deltaX > threshold) {
                        virtualMoveDirection = 1;
                    } else {
                        virtualMoveDirection = 0;
                    }
                }

                // ジャンプボタン
                jumpButton.addEventListener('touchstart', (e) => {
                    if (gameState === 'PLAYING') {
                        e.preventDefault();
                        handleAction();
                    }
                }, { passive: false });
            }

            startBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                initAudio();
                initGame();
                gameState = 'PLAYING';
                startScreen.style.display = 'none';
                scoreRegisterEl.style.display = 'none';
                rankingListEl.style.display = 'none';
                if (ingameAudioPanel) ingameAudioPanel.style.display = 'block';
                // スマホの場合はバーチャルコントローラーを表示
                if (isMobile()) {
                    virtualController.classList.add('active');
                }
                playBGM();
            });

            // BGM 音量スライダー
            bgmVolumeSlider.addEventListener('input', () => {
                setBgmVolume(bgmVolumeSlider.value);
            });

            // BGM ON/OFF トグル
            bgmToggleBtn.addEventListener('click', () => {
                bgmEnabled = !bgmEnabled;
                updateBgmToggleLabel();
                if (bgmEnabled) {
                    initAudio();
                    playBGM();
                } else {
                    bgmPlaying = false;
                }
            });

            // プレイ中 UI の音量スライダー
            bgmVolumePlaySlider.addEventListener('input', () => {
                setBgmVolume(bgmVolumePlaySlider.value);
            });

            // プレイ中 UI の ON/OFF
            bgmTogglePlayBtn.addEventListener('click', () => {
                bgmEnabled = !bgmEnabled;
                updateBgmToggleLabel();
                if (bgmEnabled) {
                    initAudio();
                    playBGM();
                } else {
                    bgmPlaying = false;
                }
            });

            registerBtn.addEventListener('click', async () => {
                const name = playerNameInput.value.trim();
                if (!name) {
                    alert('ニックネームを入力してください');
                    return;
                }
                registerBtn.disabled = true;
                registerBtn.innerText = '登録中...';

                const success = await saveScore(name, maxAltitude);
                if (success) {
                    scoreRegisterEl.style.display = 'none';
                    alert('登録完了!');
                    showRanking();
                } else {
                    alert('登録に失敗しました');
                }
                registerBtn.disabled = false;
                registerBtn.innerText = '登録';
            });

            rankingBtn.addEventListener('click', () => {
                if (rankingListEl.style.display === 'block') {
                    rankingListEl.style.display = 'none';
                } else {
                    showRanking();
                }
            });

            function update() {
                if (gameState !== 'PLAYING') return;

                // キーボード入力またはバーチャルコントローラー入力
                if (keys[ 'ArrowLeft' ] || keys[ 'KeyA' ]) player.vx = -player.speed;
                else if (keys[ 'ArrowRight' ] || keys[ 'KeyD' ]) player.vx = player.speed;
                else if (virtualMoveDirection !== 0) player.vx = virtualMoveDirection * player.speed;
                else player.vx = 0;

                player.vy += gravity;
                player.x += player.vx;
                player.y += player.vy;

                if (player.x + player.w < 0) player.x = W;
                if (player.x > W) player.x = -player.w;

                if (player.vy > 0) {
                    platforms.forEach(p => {
                        if (player.x + 10 < p.x + p.w &&
                            player.x + player.w - 10 > p.x &&
                            player.y + player.h > p.y &&
                            player.y + player.h < p.y + p.h + player.vy) {
                            player.y = p.y - player.h;
                            player.vy = 0;
                        }
                    });
                }

                if (player.y < H / 2 + cameraY) {
                    cameraY = player.y - H / 2;
                }

                let currentAltitude = Math.floor((H - 100 - player.y) / 10);
                if (currentAltitude > maxAltitude) {
                    maxAltitude = currentAltitude;
                    altitudeEl.innerText = `ALTITUDE: ${maxAltitude}m`;

                    // 山チェック（ザコは通知しない）
                    const mountain = getMountainForAltitude(maxAltitude);
                    if (mountain && mountain.name !== 'ザコ' && !passedMountains.has(mountain.name)) {
                        passedMountains.add(mountain.name);
                        currentMountain = mountain;
                        mountainNameEl.innerText = `${mountain.name} (${mountain.altitude}m)`;
                        showMountainAlert(mountain);
                        playMountainSound();
                    }

                    updateNextMountainDisplay(maxAltitude);
                }

                if (platforms[ platforms.length - 1 ].y > cameraY - 100) {
                    addPlatform(platforms[ platforms.length - 1 ].y - 100);
                }
                if (platforms[ 0 ].y > cameraY + H + 200) {
                    platforms.shift();
                }

                if (player.y > cameraY + H + 100) {
                    gameOver();
                }
            }

            function gameOver() {
                gameState = 'GAMEOVER';
                startScreen.style.display = 'block';
                virtualController.classList.remove('active');
                virtualMoveDirection = 0;
                titleEl.innerText = 'MISSION FAILED';

                const mountainText = currentMountain
                    ? `到達: ${currentMountain.name} (${currentMountain.altitude}m)`
                    : '';
                messageEl.innerHTML = `RECORD: ${maxAltitude}m<br>${mountainText}<br>登山失敗。再挑戦せよ。`;
                startBtn.innerText = 'RETRY';
                if (ingameAudioPanel) ingameAudioPanel.style.display = 'none';

                // スコア登録フォーム表示
                scoreRegisterEl.style.display = 'block';
                playerNameInput.value = localStorage.getItem('sankoku_name') || '';
            }

            // 名前を記憶
            playerNameInput.addEventListener('change', () => {
                localStorage.setItem('sankoku_name', playerNameInput.value);
            });

            function draw() {
                let bgColor = Math.max(10, 30 - maxAltitude / 50);
                ctx.fillStyle = `rgb(${bgColor}, ${bgColor}, ${bgColor})`;
                ctx.fillRect(0, 0, W, H);

                ctx.save();
                ctx.translate(0, -cameraY);

                platforms.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    if (p.y < -500) {
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(p.x, p.y, p.w, 3);
                    }
                });

                ctx.font = '40px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('🏃', player.x, player.y + 35);

                ctx.restore();

                update();
                requestAnimationFrame(draw);
            }

            // バーチャルコントローラーのセットアップ
            setupVirtualController();

            draw();
        })();
    </script>
</body>

</html>
