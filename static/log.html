<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <title>山行ログ | 糞取山酷会</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/log-viewer.css" />
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>== CLIMB LOG ==</h1>
            <a href="/" class="back-link">< BACK</a>
        </div>

        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">Total:</span>
                <span class="stat-value" id="total-climbs">0</span>
                <span class="stat-label">climbs</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Highest:</span>
                <span class="stat-value" id="highest-peak">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Members:</span>
                <span class="stat-value" id="total-members">0</span>
            </div>
        </div>

        <!-- View Toggle -->
        <div class="view-toggle">
            <button class="toggle-btn active" data-view="list">[LIST]</button>
            <button class="toggle-btn" data-view="map">[MAP]</button>
        </div>

        <!-- Filter -->
        <div class="filter-section">
            <span class="filter-label">Filter by member:</span>
            <select class="filter-select" id="member-filter">
                <option value="">All members</option>
            </select>
            <span class="filter-label" style="margin-left: 1rem;">Area:</span>
            <select class="filter-select" id="area-filter">
                <option value="">All areas</option>
            </select>
        </div>

        <!-- List View (Default) -->
        <div class="list-view" id="list-container">
            <ul class="climb-list" id="climb-list"></ul>
        </div>

        <!-- Map View -->
        <div class="map-view" id="map-container">
            <div id="map"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            Powered by <a href="https://leafletjs.com/" target="_blank" rel="noopener">Leaflet</a> |
            Map data &copy; <a href="https://www.openstreetmap.org/" target="_blank" rel="noopener">OpenStreetMap</a>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FIT Decoder -->
    <script src="https://cdn.jsdelivr.net/npm/fit-decoder@1.0.5/dist/index.js"></script>

    <script>
        window.LOG_VIEWER_CONFIG = {
            dataUrl: 'data/activity_logs.json',
            dataKey: 'activity_logs',
            dataDir: 'data/activity_logs'
        };
    </script>
    <script src="js/log-viewer.js"></script>
</body>
</html>
